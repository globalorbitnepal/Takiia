name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and run actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" -o download-actionlint.bash
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
          ./actionlint -color

  quality:
    name: Build and quality checks
    runs-on: ubuntu-latest
    needs: actionlint
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://takiia_test:takiia_test@127.0.0.1:5432/takiia_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: takiia_test
          POSTGRES_PASSWORD: takiia_test
          POSTGRES_DB: takiia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takiia_test -d takiia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Prisma migrate (test database)
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Verify Postgres for integration tests
        working-directory: apps/api
        run: |
          node --input-type=module -e "import { PrismaClient } from '@prisma/client'; const p = new PrismaClient({ datasourceUrl: process.env.DATABASE_URL }); await p.\$queryRaw\`SELECT 1\`; const plans = await p.plan.count(); console.log('postgres ok plans=' + plans); if (plans < 1) { throw new Error('Plan seed missing'); } await p.\$disconnect();"

      - name: Test
        working-directory: apps/api
        run: npx tsx scripts/ci-test.mjs

      - name: Build API
        run: npm run build --workspace @takiia/api

      - name: Build Web
        run: npm run build --workspace @takiia/web
        env:
          NEXT_PUBLIC_API_URL: https://api.takiia.com
